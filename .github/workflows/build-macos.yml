name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-arm64]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            setup.py
            packaging/requirements-macos.txt
      - name: Install dependencies
        run: python -m pip install '.[desktop]' -r packaging/requirements-macos.txt pytest
      - name: Test source
        run: python -m pytest tests -q --tb=short
      - name: Build and validate app, DMG and ZIP
        run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: PikachuNovel-macOS-arm64
          path: |
            release/macos-arm64/*.dmg
            release/macos-arm64/*.app.zip
            release/macos-arm64/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
